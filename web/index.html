<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bugclaw</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem("bugclaw-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")}catch{document.documentElement.dataset.theme="light"}</script>
<link rel="icon" href="/logo.svg">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="shell" id="shell">
  <aside class="rail">
    <a class="brand" href="/" data-link><span class="mark"></span><span class="label">Bugclaw</span></a>
    <div class="sect">Workspace</div>
    <nav>
      <a href="/" data-link data-nav="overview" title="Overview"><span data-icon="layout-dashboard"></span><span class="label">Overview</span></a>
      <a href="/scans" data-link data-nav="scans" title="Scans"><span data-icon="scan-search"></span><span class="label">Scans</span></a>
      <a href="/candidates" data-link data-nav="candidates" title="Findings"><span data-icon="shield-alert"></span><span class="label">Findings</span></a>
      <a href="/setup" data-link data-nav="setup" title="Setup"><span data-icon="settings"></span><span class="label">Setup</span></a>
    </nav>
    <div class="rail-scroll">
      <section class="rail-section">
        <div class="sect">Recent scans</div>
        <div class="recent" id="recent"></div>
      </section>
      <section class="rail-section">
        <div class="sect">Activity</div>
        <div class="recent activity-list" id="activity"></div>
      </section>
    </div>
    <div class="rail-foot">
      <div class="health" id="rail-health"><b>Runtime</b>Checking…</div>
      <button class="rail-action" id="theme-toggle"><span data-icon="moon"></span><span class="label">Dark mode</span></button>
      <button class="collapse rail-action" id="collapse"><span data-icon="panel-left-close"></span><span class="label">Collapse</span></button>
    </div>
  </aside>
  <main id="view" tabindex="-1"></main>
</div>
<script type="module" src="/app.js"></script>
</body>
</html>
