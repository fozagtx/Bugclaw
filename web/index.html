<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bugclaw</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%230f1115'/%3E%3Crect x='5' y='5' width='6' height='6' rx='1.5' fill='%23ef6f2e'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="shell" id="shell">
  <aside class="rail">
    <a class="brand" href="/" data-link><span class="mark"></span><span class="label">Bugclaw</span></a>
    <div class="sect">Workspace</div>
    <nav>
      <a href="/" data-link data-nav="overview" title="Overview"><svg class="i" viewBox="0 0 16 16"><rect x="2" y="2" width="5" height="5" rx="1"/><rect x="9" y="2" width="5" height="5" rx="1"/><rect x="2" y="9" width="5" height="5" rx="1"/><rect x="9" y="9" width="5" height="5" rx="1"/></svg><span class="label">Overview</span></a>
      <a href="/scans" data-link data-nav="scans" title="Scans"><svg class="i" viewBox="0 0 16 16"><path d="M3 4h10M3 8h10M3 12h6"/></svg><span class="label">Scans</span></a>
      <a href="/candidates" data-link data-nav="candidates" title="Findings"><svg class="i" viewBox="0 0 16 16"><path d="M8 1.8 13.5 4v4c0 3.2-2.3 5.3-5.5 6.2C4.8 13.3 2.5 11.2 2.5 8V4z"/></svg><span class="label">Findings</span></a>
      <a href="/setup" data-link data-nav="setup" title="Setup"><svg class="i" viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/></svg><span class="label">Setup</span></a>
    </nav>
    <div class="sect">Recent scans</div>
    <div class="recent" id="recent"></div>
    <div class="rail-foot">
      <div class="health" id="rail-health"><b>Runtime</b>Checking…</div>
      <button class="collapse" id="collapse" title="Collapse sidebar"><svg class="i" viewBox="0 0 16 16"><path d="M8 4 4 8l4 4M12.5 4l-4 4 4 4"/></svg><span class="label">Collapse</span></button>
    </div>
  </aside>
  <main id="view" tabindex="-1"></main>
</div>
<script type="module" src="/app.js"></script>
</body>
</html>
