<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bugclaw</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23ef6f2e'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="shell" id="shell">
  <aside class="rail">
    <div class="rail-head">
      <a class="brand" href="/" data-link><span class="mark"></span><span class="label">Bugclaw</span></a>
      <button class="collapse" id="collapse" aria-label="Collapse sidebar" title="Collapse sidebar">
        <svg viewBox="0 0 16 16" width="16" height="16"><path d="M10 3 5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
      </button>
    </div>
    <nav>
      <a href="/" data-link data-nav="overview" title="Overview"><svg viewBox="0 0 16 16"><path d="M2 2h5v5H2zM9 2h5v5H9zM2 9h5v5H2zM9 9h5v5H9z"/></svg><span class="label">Overview</span></a>
      <a href="/scans" data-link data-nav="scans" title="Scans"><svg viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3.5 3.5"/></svg><span class="label">Scans</span></a>
      <a href="/candidates" data-link data-nav="candidates" title="Findings"><svg viewBox="0 0 16 16"><path d="M8 2 14 13H2z"/><path d="M8 6.5v3M8 11.2v.3"/></svg><span class="label">Findings</span></a>
      <a href="/setup" data-link data-nav="setup" title="Setup"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/></svg><span class="label">Setup</span></a>
    </nav>
    <div class="rail-foot label" id="rail-health">Checking runtime…</div>
  </aside>
  <main id="view" tabindex="-1"></main>
</div>
<script type="module" src="/app.js"></script>
</body>
</html>
